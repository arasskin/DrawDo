name: datafriend_todo_lab
description: Matched Flutter todo demos and benchmarks for Datafriend and flutter_instantdb.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  drawdo:
    path: ../app
  flutter_instantdb: 2.3.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  logging: ^1.3.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5
flutter:
  uses-material-design: true
