name: Deploy Littlebear

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: littlebear-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liburing-dev libsodium-dev cmake
      - name: Build and check storage components
        run: timeout 180 make -C littlebear all test
      - name: Check TCP transport and signed writes
        run: timeout 60 python3 scripts/test_littlebear_tcp.py littlebear/build/server
      - name: Check Datafriend and Littlebear integration
        run: |
          cmake -S datafriend -B /tmp/datafriend -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/datafriend --target network_test transport_test -j 2
          ctest --test-dir /tmp/datafriend --output-on-failure -R network_test
          timeout 180 python3 scripts/test_native_sync.py littlebear/build/server /tmp/datafriend/transport_test
      - name: Run address and undefined-behavior sanitizers
        run: timeout 180 make -C littlebear sanitize
      - name: Package the tested server
        if: github.ref == 'refs/heads/main'
        run: |
          python3 deploy/package.py littlebear/build/server "$RUNNER_TEMP/littlebear.tar.gz"
      - name: Retain deployment artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: littlebear-server
          path: ${{ runner.temp }}/littlebear.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 147.182.181.182
      DEPLOY_USER: drawdo-deploy
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DODO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DODO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/dodo"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/dodo" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host dodo-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/dodo
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Download the tested server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: littlebear-server
          path: ${{ runner.temp }}

      - name: Upload and restart the tested server
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp "$RUNNER_TEMP/littlebear.tar.gz" "dodo-deploy:/opt/littlebear/incoming/${release_id}.tar.gz"
          # The identifier consists only of GitHub-provided SHA and numeric run IDs.
          # shellcheck disable=SC2029
          ssh dodo-deploy "bash -s -- '$release_id'" < deploy/deploy.sh
          printf 'Deployed %s to %s.\n' "$GITHUB_SHA" "$DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/dodo" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
