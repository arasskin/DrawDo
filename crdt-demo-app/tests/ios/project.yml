name: CRDTSyncTest
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  CRDTSyncTest:
    type: bundle.ui-testing
    platform: iOS
    sources: [SyncTest.m]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawdo.CRDTSyncTest
schemes:
  CRDTSyncTest:
    build:
      targets:
        CRDTSyncTest: all
    test:
      targets: [CRDTSyncTest]
